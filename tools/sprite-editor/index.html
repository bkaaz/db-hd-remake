<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite Editor — DBZ:HD Remake</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="group">
        <label class="filebtn">
          Load sheet
          <input id="file" type="file" accept="image/*" hidden />
        </label>
      </div>
      <div class="group">
        <label>Character <input id="char-name" type="text" size="10" /></label>
        <label>Atlas <input id="atlas-name" type="text" size="12" /></label>
      </div>
      <div class="group">
        <span class="lbl">Mode:</span>
        <button id="mode-frame">Frame</button>
        <button id="mode-anchor">Anchor</button>
      </div>
      <div class="group">
        <span class="lbl">Zoom:</span>
        <button id="zoom-out">−</button>
        <span id="zoom-label">200%</span>
        <button id="zoom-in">＋</button>
      </div>
      <div class="group">
        <span class="lbl">BG:</span>
        <label><input id="bg-enabled" type="checkbox" /> transparent</label>
        <span id="bg-swatch" class="swatch" title="Background color"></span>
        <button id="bg-pick" title="Eyedropper: click the sheet to pick the background color">Pick</button>
        <label>tol <input id="bg-tol" type="number" class="dur" value="0" min="0" max="255" /></label>
      </div>
      <div class="group">
        <span class="lbl">Detect:</span>
        <button id="detect-all" title="Detect all sprites as frames">All</button>
        <button id="detect-click" title="Magic click: click a sprite to make it a frame">Magic click</button>
        <label>gap <input id="detect-gap" type="number" class="dur" value="2" min="0" max="8" /></label>
        <label>min <input id="detect-min" type="number" class="dur" value="12" min="1" /></label>
      </div>
      <div class="group">
        <button id="export-json">Export JSON</button>
        <button id="export-atlas">Export atlas</button>
      </div>
    </header>

    <main>
      <section id="sheet-wrap">
        <canvas id="sheet"></canvas>
      </section>

      <aside id="side">
        <div class="card">
          <h3>Preview</h3>
          <canvas id="preview" width="240" height="240"></canvas>
          <div class="row">
            <button id="play">▶ Play</button>
            <button id="stop">■ Stop</button>
          </div>
        </div>

        <div class="card">
          <h3>Frames</h3>
          <p class="hint">Drag a rectangle on the sheet to create a frame.
            In <em>Anchor</em> mode, click inside the selected frame to set its pivot.</p>
          <div id="frames-panel"></div>
        </div>

        <div class="card">
          <h3>Animations</h3>
          <div id="anims-panel"></div>
        </div>
      </aside>
    </main>

    <footer id="status">Load a sprite sheet to begin.</footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
